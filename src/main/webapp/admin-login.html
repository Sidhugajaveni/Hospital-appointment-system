<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | City Care Hospital</title>

<style>
:root{
    --blue:#0d6efd;
    --green:#20c997;
    --dark:#1f2933;
}

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#e3f2fd,#f1fdf6);
}

/* HEADER */
.header{
    background:linear-gradient(to right,var(--blue),var(--green));
    color:white;
    padding:30px;
    text-align:center;
}
.header h1{
    margin:0;
    font-size:34px;
}
.header p{
    margin-top:8px;
    font-size:15px;
}

/* CONTAINER */
.container{
    max-width:420px;
    margin:70px auto;
    padding:20px;
}

/* CARD */
.card{
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 25px 60px rgba(0,0,0,0.18);
    text-align:center;
}

.card h2{
    color:var(--dark);
    margin-bottom:10px;
}

.card p{
    color:#555;
    font-size:14px;
    margin-bottom:25px;
}

/* INPUTS */
input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border-radius:12px;
    border:1px solid #ced4da;
    font-size:15px;
}
input:focus{
    outline:none;
    border-color:var(--blue);
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    color:white;
    background:linear-gradient(to right,var(--blue),var(--green));
    cursor:pointer;
}
button:hover{
    box-shadow:0 10px 20px rgba(0,0,0,0.25);
}

/* FOOTER */
.footer{
    text-align:center;
    margin-top:30px;
    font-size:13px;
    color:#666;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>🏥 City Care Hospital</h1>
    <p>Admin Secure Login</p>
</div>

<!-- LOGIN CARD -->
<div class="container">
    <div class="card">

        <h2>Admin Login 👨‍⚕️</h2>
        <p>Please login to access the admin dashboard</p>

        <form action="adminLogin" method="post">
            <input type="text" name="username" placeholder="Admin Username" required>
            <input type="password" name="password" placeholder="Admin Password" required>
            <button type="submit">Login</button>
        </form>

    </div>
</div>

<!-- FOOTER -->
<div>
    © 2025 City Care Hospital | Authorized Access Only |Developed by <strong>Gajaveni Sidhu</strong>
    </div>

</body>
</html>
